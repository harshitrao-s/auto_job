# ---------------------------------------------------------------------------
# Screening-question answer bank.
#   match   : regex tested against the lowercased question label
#   type    : number | boolean | text | choice
#   value   : literal answer, or "skill:<name>" to pull years from `skills`
#   For boolean, value true -> picks Yes, false -> picks No.
# Rules are evaluated top to bottom; first match wins.
# ---------------------------------------------------------------------------
answer_rules:
  - match: "how many years.*(experience|work).*(do you have)?"
    type: number
    value: "auto_experience"     # resolves per-skill, else total experience

  - match: "(years|yrs).*(of )?(professional|total|overall|relevant).*experience"
    type: number
    value: "profile:professional.total_experience_years"

  - match: "(notice period|how soon can you join|when can you (start|join)).*(days)?"
    type: number
    value: "profile:professional.notice_period_days"

  - match: "(are you )?(legally )?(authori[sz]ed|eligible) to work"
    type: boolean
    value: true

  - match: "(require|need).*(visa )?sponsorship"
    type: boolean
    value: false

  - match: "(willing|able) to (relocate|commute|travel)"
    type: boolean
    value: true

  - match: "(comfortable|willing).*(work from office|wfo|hybrid|onsite|on-site|in office)"
    type: boolean
    value: true

  - match: "(do you have|have you).*(bachelor|degree|graduat)"
    type: boolean
    value: true

  - match: "highest (level of )?(education|degree|qualification)"
    type: choice
    value: "profile:professional.highest_education"

  - match: "current (annual )?(ctc|salary|compensation)"
    type: number
    value: "profile:professional.current_ctc_lpa"   # null -> asks the human

  - match: "expected (annual )?(ctc|salary|compensation)"
    type: number
    value: "profile:professional.expected_ctc_lpa"  # null -> asks the human

  - match: "(current|present) (company|employer|organization)"
    type: text
    value: "profile:professional.current_company"

  - match: "(current|present) (job title|designation|role)"
    type: text
    value: "profile:professional.current_title"

  - match: "(current|present) location|where are you (currently )?(based|located)"
    type: text
    value: "profile:personal.city"

  - match: "(phone|mobile).*(country code)|country code"
    type: choice
    value: "profile:personal.phone_country_code"

  - match: "(phone|mobile|contact) number"
    type: text
    value: "profile:personal.phone"

  - match: "(email|e-mail) address"
    type: text
    value: "profile:personal.email"

  - match: "linkedin( profile)?( url| link)?"
    type: text
    value: "profile:personal.linkedin"

  - match: "(github|portfolio|website|personal site)( url| link)?"
    type: text
    value: "profile:personal.github"

  - match: "first name|given name"
    type: text
    value: "profile:personal.first_name"

  - match: "last name|surname|family name"
    type: text
    value: "profile:personal.last_name"

  - match: "(tell us|why).*(interested|want to (work|join)|this role)"
    type: text
    value: "profile:narratives.why_interested"

  - match: "(summary|about (you|yourself)|cover letter)"
    type: text
    value: "profile:narratives.summary"

  - match: "have you (been )?(convicted|arrested)"
    type: boolean
    value: false

  - match: "(are you|do you).*(18|eighteen) (years|yrs)"
    type: boolean
    value: true
